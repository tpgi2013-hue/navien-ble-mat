########################################
#  HA 엔티티
########################################

climate:
  - platform: navien_mat
    name: "Mat"
    id: mat_climate
    icon: mdi:radiator
    visual:
      min_temperature: 28
      max_temperature: 45
      temperature_step: 1

  - platform: navien_mat
    name: "Mat2"
    id: mat_climate2
    icon: mdi:radiator
    visual:
      min_temperature: 28
      max_temperature: 45
      temperature_step: 1

########################################
#  HA -> 매트 제어 요청 수거
########################################

interval:
  - interval: 5s                  # 매트1 응답 감시
    then:
      - lambda: |-
          if (id(mat_ble)->connected() && id(last_rx_ms) != 0 &&
              millis() - id(last_rx_ms) > 10000 && id(mat_auth).state == "정상")
            id(mat_auth).publish_state("응답 없음");

  - interval: 200ms               # 매트1
    then:
      - if:
          condition:
            lambda: 'return id(mat_climate).take_pending();'
          then:
            - lambda: |-
                // 끌 때만 6, 켤 때만 난방(1), 이미 켜져 있으면 현재 모드(수면 등) 유지
                if (!id(mat_climate).requested_power()) id(tx_mode) = 6;
                else if (id(tx_mode) == 6)              id(tx_mode) = 1;
                int t = id(mat_climate).requested_temp();
                if (t >= 28 && t <= 45) id(tx_temp) = t;
            - script.execute: send_cmd

  - interval: 5s                  # 매트2 응답 감시
    then:
      - lambda: |-
          if (id(mat_ble2)->connected() && id(last_rx_ms2) != 0 &&
              millis() - id(last_rx_ms2) > 10000 && id(mat_auth2).state == "정상")
            id(mat_auth2).publish_state("응답 없음");

  - interval: 200ms               # 매트2
    then:
      - if:
          condition:
            lambda: 'return id(mat_climate2).take_pending();'
          then:
            - lambda: |-
                // 끌 때만 6, 켤 때만 난방(1), 이미 켜져 있으면 현재 모드(수면 등) 유지
                if (!id(mat_climate2).requested_power()) id(tx_mode2) = 6;
                else if (id(tx_mode2) == 6)              id(tx_mode2) = 1;
                int t = id(mat_climate2).requested_temp();
                if (t >= 28 && t <= 45) id(tx_temp2) = t;
            - script.execute: send_cmd2

switch:
  # ── 매트1 ──
  - platform: template
    name: "Mat Child Lock"
    id: mat_lock_sw
    icon: mdi:lock
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: 'id(tx_lock) = true;'
      - script.execute: send_cmd
    turn_off_action:
      - lambda: 'id(tx_lock) = false;'
      - script.execute: send_cmd

  - platform: template
    name: "Mat BLE Enable"
    id: ble_enable
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(mat_ble)->set_enabled(true);'
    turn_off_action:
      - script.stop: reconnect_later
      - lambda: 'id(mat_ble)->set_enabled(false);'

  # ── 매트2 ──
  - platform: template
    name: "Mat2 Child Lock"
    id: mat_lock_sw2
    icon: mdi:lock
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: 'id(tx_lock2) = true;'
      - script.execute: send_cmd2
    turn_off_action:
      - lambda: 'id(tx_lock2) = false;'
      - script.execute: send_cmd2

  - platform: template
    name: "Mat2 BLE Enable"
    id: ble_enable2
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(mat_ble2)->set_enabled(true);'
    turn_off_action:
      - script.stop: reconnect_later2
      - lambda: 'id(mat_ble2)->set_enabled(false);'

select:
  # ── 매트1 ──
  - platform: template
    name: "Mat Mode"
    id: mat_mode_sel
    icon: mdi:tune
    optimistic: false             # 표시는 매트가 보고한 실제 상태로만 갱신
    options:
      - "난방"
      - "수면"
      - "빠른난방"
    set_action:
      - if:
          condition:
            lambda: 'return x == "빠른난방";'
          then:
            # 빠른난방 = 현재 모드(난방/수면) 위에 30분 부가기능. 꺼진 상태에선 무시
            - if:
                condition:
                  lambda: 'return id(tx_mode) != 6;'
                then:
                  - lambda: |-
                      id(once_mode) = 7;
                      id(fast_req) = true;
                  - script.execute: send_cmd
                else:
                  - logger.log: { format: "매트1: 전원 꺼짐 상태 - 빠른난방 무시", level: WARN }
          else:
            # 난방/수면 선택 → 해당 모드로, 빠른난방 중이었으면 함께 끔
            - lambda: 'id(tx_mode) = (x == "수면") ? 3 : 1;'
            - script.execute: send_cmd
            - if:
                condition:
                  lambda: 'return id(fast_on);'
                then:
                  - delay: 400ms
                  - lambda: |-
                      id(once_mode) = 7;
                      id(fast_req) = false;
                  - script.execute: send_cmd

  - platform: template
    name: "Mat Volume"
    id: mat_vol
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    options:
      - "음소거"
      - "1단"
      - "2단"
      - "3단"
    set_action:
      - lambda: |-
          if (x == "음소거")      id(tx_vol) = 0;
          else if (x == "1단")    id(tx_vol) = 1;
          else if (x == "2단")    id(tx_vol) = 2;
          else                    id(tx_vol) = 3;
      - script.execute: send_cmd

  # ── 매트2 ──
  - platform: template
    name: "Mat2 Mode"
    id: mat_mode_sel2
    icon: mdi:tune
    optimistic: false             # 표시는 매트가 보고한 실제 상태로만 갱신
    options:
      - "난방"
      - "수면"
      - "빠른난방"
    set_action:
      - if:
          condition:
            lambda: 'return x == "빠른난방";'
          then:
            # 빠른난방 = 현재 모드(난방/수면) 위에 30분 부가기능. 꺼진 상태에선 무시
            - if:
                condition:
                  lambda: 'return id(tx_mode2) != 6;'
                then:
                  - lambda: |-
                      id(once_mode2) = 7;
                      id(fast_req2) = true;
                  - script.execute: send_cmd2
                else:
                  - logger.log: { format: "매트2: 전원 꺼짐 상태 - 빠른난방 무시", level: WARN }
          else:
            # 난방/수면 선택 → 해당 모드로, 빠른난방 중이었으면 함께 끔
            - lambda: 'id(tx_mode2) = (x == "수면") ? 3 : 1;'
            - script.execute: send_cmd2
            - if:
                condition:
                  lambda: 'return id(fast_on2);'
                then:
                  - delay: 400ms
                  - lambda: |-
                      id(once_mode2) = 7;
                      id(fast_req2) = false;
                  - script.execute: send_cmd2

  - platform: template
    name: "Mat2 Volume"
    id: mat_vol2
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    options:
      - "음소거"
      - "1단"
      - "2단"
      - "3단"
    set_action:
      - lambda: |-
          if (x == "음소거")      id(tx_vol2) = 0;
          else if (x == "1단")    id(tx_vol2) = 1;
          else if (x == "2단")    id(tx_vol2) = 2;
          else                    id(tx_vol2) = 3;
      - script.execute: send_cmd2

number:
  - platform: template
    name: "Mat Sleep Hours"
    id: mat_sleep_h
    icon: mdi:sleep
    unit_of_measurement: "h"
    min_value: 5
    max_value: 12
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8

  - platform: template
    name: "Mat2 Sleep Hours"
    id: mat_sleep_h2
    icon: mdi:sleep
    unit_of_measurement: "h"
    min_value: 5
    max_value: 12
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_rssi
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    accuracy_decimals: 0
    device_class: ""
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic


binary_sensor:
  - platform: template
    name: "Mat Fault"
    id: mat_fault
    device_class: problem
    lambda: 'return id(err_code) > 0;'

  - platform: template
    name: "Mat2 Fault"
    id: mat_fault2
    device_class: problem
    lambda: 'return id(err_code2) > 0;'

button:
  # ── 매트1 ──
  - platform: template
    name: "Mat Ion Care"
    icon: mdi:shimmer
    on_press:
      - lambda: 'id(once_mode) = 8;'
      - script.execute: send_cmd

  # 매트를 등록 모드로 둔 뒤 누름 (평소엔 HA 에서 비활성)
  - platform: template
    name: "Mat Re-register"
    icon: mdi:link-variant
    entity_category: config
    disabled_by_default: true
    on_press:
      - script.stop: reconnect_later
      - lambda: |-
          id(have_id) = false;
          id(mat_auth).publish_state("재등록 중");
          ESP_LOGI("navien", "deviceID 삭제 → 재등록 요청");
      - if:
          condition:
            lambda: 'return id(mat_ble)->connected();'
          then:
            - script.execute: send_register
          else:
            - lambda: 'id(mat_ble)->set_enabled(true);'   # 연결되면 on_connect 가 등록요청 전송

  # ── 매트2 ──
  - platform: template
    name: "Mat2 Ion Care"
    icon: mdi:shimmer
    on_press:
      - lambda: 'id(once_mode2) = 8;'
      - script.execute: send_cmd2

  # 매트를 등록 모드로 둔 뒤 누름 (평소엔 HA 에서 비활성)
  - platform: template
    name: "Mat2 Re-register"
    icon: mdi:link-variant
    entity_category: config
    disabled_by_default: true
    on_press:
      - script.stop: reconnect_later2
      - lambda: |-
          id(have_id2) = false;
          id(mat_auth2).publish_state("재등록 중");
          ESP_LOGI("navien2", "deviceID 삭제 → 재등록 요청");
      - if:
          condition:
            lambda: 'return id(mat_ble2)->connected();'
          then:
            - script.execute: send_register2
          else:
            - lambda: 'id(mat_ble2)->set_enabled(true);'   # 연결되면 on_connect 가 등록요청 전송
