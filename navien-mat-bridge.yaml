  # ── 매트2 ──
  - platform: ble_client
    ble_client_id: mat_ble2
    id: rx_012
    internal: true
    service_uuid: '00001c0d-d102-11e1-9b23-2ce2a80000dd'
    characteristic_uuid: '00001c0d-d102-11e1-9b23-2ce2a80100dd'
    notify: true
    update_interval: never
    on_notify:
      then:
        - lambda: 'id(rx_buf2).assign(x.begin(), x.end());'
        - script.execute: parse_rx2

  - platform: ble_client
    ble_client_id: mat_ble2
    id: rx_022
    internal: true
    service_uuid: '00001c0d-d102-11e1-9b23-2ce2a80000dd'
    characteristic_uuid: '00001c0d-d102-11e1-9b23-2ce2a80200dd'
    notify: true
    update_interval: never
    on_notify:
      then:
        - lambda: 'id(rx_buf2).assign(x.begin(), x.end());'
        - script.execute: parse_rx2

  - platform: template
